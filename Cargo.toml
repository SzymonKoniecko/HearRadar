[package]
name = "radar"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.10", features = ["desktop", "macro", "hooks", "html"] }
cpal = "0.16"
anyhow = "1"

[features]
default = ["desktop"]
desktop = [
    "dioxus/desktop",
    "dioxus/launch",
    "dioxus/macro",
    "dioxus/hooks",
    "dioxus/html",
]